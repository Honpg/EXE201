<!-- popup.html -->
<!DOCTYPE html>
<html>
<head>
  <title>Ocean AI - Generate custom meeting recaps, reports, and transcripts using AI</title>
  
  <style>
    body {
      width: 300px;
      height: 340px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(to bottom, #f3f4f6, #ede9fe);
      font-family: Arial, sans-serif;
      margin: 0;
    }
    .wrapper-div {
      text-align: center;
    }
    .logo {
      font-size: 3.0rem;
      font-weight: bold;
      background: linear-gradient(to right, #f97316, #ec4899, #9333ea);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }
    .details {
      font-size: 0.85rem;
      font-weight: 550;
      color: #9333ea;
      margin-bottom: 20px;
    }
    .all-set {
      font-size: 1.0rem;
      font-weight: 600;
      color: #151515;
      margin: 15px 0;
    }
    .action-buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 20px;
    }
    .icon-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      font-size: 1rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(to right, #f97316, #ec4899, #9333ea);
      border: none;
      padding: 10px;
      border-radius: 10px;
      width: 100px;
      text-align: center;
      transition: all 0.3s ease;
    }
    .icon-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
    #email {
      font-size: 1rem;
      font-weight: 300;
      font-style: italic;
      margin-top: 0;
    }
    .icon {
      width: 24px;
      height: 24px;
      filter: brightness(0) invert(1);
    }
    .label {
      font-size: 0.75rem;
      color: #ffffff;
      margin-top: 5px;
    }
  </style>
</head>

<body>
  <div class="wrapper-div">
    <h1 class="logo">Ocean AI</h1>
    <p class="details">Generate custom meeting recaps, reports, and transcripts using AI</p>
    <p id="email"></p>
    <div class="signed-in-only">
      <p class="all-set">You are all set!</p>
      <div class="action-buttons">
        <!-- View Previous Meetings with Icon and Label -->
        <a href="#" id="view-meetings" class="icon-button" title="View Previous Meetings">
          <img src="https://i.imgur.com/PkQVqze.png" alt="View Meetings" class="icon">
          <span class="label">View Previous Meetings</span>
        </a>
        
        <!-- Screenshot Capture with Icon and Label -->
        <a href="#" id="screenshot-btn" class="icon-button" title="Capture Screenshot">
          <img src="https://i.imgur.com/ylQ2D6k.png" alt="Capture" class="icon">
          <span class="label">Capture</span>
        </a>
      </div>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>

</html>
