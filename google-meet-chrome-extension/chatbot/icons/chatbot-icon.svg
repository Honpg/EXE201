<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gemini-inspired gradient background circle -->
  <defs>
    <linearGradient id="geminiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4285F4;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#34A853;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FBBC04;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#EA4335;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9C27B0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#FFF;stop-opacity:0.6" />
    </linearGradient>
  </defs>
  
  <!-- Main circle background -->
  <circle cx="12" cy="12" r="11" fill="url(#geminiGradient)" stroke="#fff" stroke-width="0.5"/>
  
  <!-- Robot head -->
  <path d="M8 9h8a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2z" fill="#fff" opacity="0.9"/>
  
  <!-- Eyes -->
  <circle cx="10" cy="12" r="1.5" fill="url(#geminiGradient)"/>
  <circle cx="14" cy="12" r="1.5" fill="url(#geminiGradient)"/>
  
  <!-- Eye highlights -->
  <circle cx="10.3" cy="11.7" r="0.4" fill="#fff"/>
  <circle cx="14.3" cy="11.7" r="0.4" fill="#fff"/>
  
  <!-- Mouth -->
  <path d="M10 14.5h4a1 1 0 0 1 0 2h-4a1 1 0 0 1 0-2z" fill="url(#geminiGradient)" opacity="0.7"/>
  
  <!-- Antenna -->
  <line x1="12" y1="7" x2="12" y2="9" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="12" cy="6.5" r="1" fill="url(#sparkle)"/>
  
  <!-- Side decorations (Gemini sparkles) -->
  <path d="M5 8l1.5 1.5L5 11l-1.5-1.5L5 8z" fill="url(#sparkle)" opacity="0.8"/>
  <path d="M19 13l1.5 1.5L19 16l-1.5-1.5L19 13z" fill="url(#sparkle)" opacity="0.8"/>
  
  <!-- Small sparkles -->
  <circle cx="7" cy="6" r="0.8" fill="url(#sparkle)" opacity="0.6"/>
  <circle cx="17" cy="18" r="0.8" fill="url(#sparkle)" opacity="0.6"/>
</svg>
